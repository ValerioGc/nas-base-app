name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  verify:
    name: Verify the library and its package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prepare and verify tool permissions
        run: |
          sudo /bin/bash .github/scripts/prepare-tools.sh \
            --node "$(node -p 'process.execPath')" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" \
            --runner-uid "$(id -u)" \
            --tool-cache "$RUNNER_TOOL_CACHE"
          node --input-type=module -e '
            import { toolEnvironment, toolPath, execToolSync } from "./scripts/process-tools.mjs";
            toolEnvironment();
            for (const tool of ["npm", "git"]) toolPath(tool);
            execToolSync("npm", ["--version"], { stdio: "inherit" });
            execToolSync("git", ["--version"], { stdio: "inherit" });
          '
      - name: Install npm dependencies
        run: npm ci
      - name: Verify, test and build
        run: npm run check && npm run test:coverage
      - name: Pack and verify the package
        run: npm run nas:package && npm run nas:test
